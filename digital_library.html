<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Library - Gyanshree School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .resource-card:hover { transform: translateY(-4px); }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <nav class="container mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
            <a href="index.html" class="flex items-center space-x-3">
                <i data-lucide="arrow-left" class="w-5 h-5 text-gray-600"></i>
                <span class="text-xl font-bold text-gray-800">Back to Library</span>
            </a>
            <div class="flex items-center space-x-2 text-blue-600">
                <i data-lucide="monitor" class="w-6 h-6"></i>
                <span class="font-bold hidden sm:inline uppercase tracking-wider">Digital Resources</span>
            </div>
        </nav>
    </header>

    <main class="flex-grow container mx-auto px-4 py-12">
        <div class="max-w-4xl mx-auto mb-12 text-center">
            <h1 class="text-4xl font-extrabold text-gray-900 mb-4">Digital Learning Hub</h1>
            <p class="text-gray-600 text-lg">Access a world of knowledge through our curated list of educational platforms and digital libraries.</p>
        </div>

        <!-- Resources Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="links-container">
            <!-- Links will be generated here -->
        </div>
    </main>

    <footer class="bg-white border-t py-8 mt-12">
        <div class="container mx-auto px-4 text-center text-sm text-gray-500">
            <p>&copy; 2025 Gyanshree School. Curated for Senior Students (VI-XII).</p>
        </div>
    </footer>

    <script>
        const resources = [
            { name: "Khan Academy", url: "https://www.khanacademy.org", description: "Free online courses, lessons & practice." },
            { name: "BYJU'S", url: "https://www.byjus.com", description: "Learning app for K-12 and competitive exams." },
            { name: "Vedantu", url: "https://www.vedantu.com", description: "Live online tutoring for students." },
            { name: "Toppr", url: "https://www.toppr.com", description: "Personalized learning for school students." },
            { name: "NROER", url: "https://www.nroer.gov.in", description: "National Repository of Open Educational Resources." },
            { name: "Swayam", url: "https://www.swayam.gov.in", description: "Free online education by Govt. of India." },
            { name: "NPTEL", url: "https://www.nptel.ac.in", description: "Online courses in engineering and science." },
            { name: "Meritnation", url: "https://www.meritnation.com", description: "Study material and live classes for K-12." },
            { name: "Edmodo", url: "https://www.edmodo.com", description: "Connect with students and teachers." },
            { name: "Teachmint", url: "https://www.teachmint.com", description: "LMS for schools and tuition classes." },
            { name: "Unacademy", url: "https://www.unacademy.com", description: "Preparation for competitive exams." },
            { name: "Coursera", url: "https://www.coursera.org", description: "Degrees and certificates from world-class universities." },
            { name: "CK-12", url: "https://www.ck12.org", description: "Free online textbooks and exercises." },
            { name: "Homeschool Math", url: "https://www.homeschoolmath.net", description: "Free math worksheets and curriculum." },
            { name: "PhET Simulations", url: "https://phet.colorado.edu", description: "Interactive science and math simulations." },
            { name: "FutureLearn", url: "https://www.futurelearn.com", description: "Short online courses from top universities." },
            { name: "LearnX", url: "https://www.learnx.org", description: "Educational platform for future-ready skills." }
        ];

        function createResourceCard(resource) {
            return `
                <a href="${resource.url}" target="_blank" rel="noopener noreferrer" class="resource-card bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:border-blue-300 hover:shadow-md transition-all duration-300 group">
                    <div class="flex items-start justify-between mb-4">
                        <div class="bg-blue-50 p-3 rounded-lg text-blue-600 group-hover:bg-blue-600 group-hover:text-white transition-colors">
                            <i data-lucide="external-link" class="w-6 h-6"></i>
                        </div>
                    </div>
                    <h3 class="text-xl font-bold text-gray-800 mb-2">${resource.name}</h3>
                    <p class="text-gray-500 text-sm leading-relaxed mb-4">${resource.description}</p>
                    <div class="text-blue-600 text-xs font-semibold flex items-center">
                        Visit Site <i data-lucide="chevron-right" class="w-3 h-3 ml-1"></i>
                    </div>
                </a>
            `;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('links-container');
            container.innerHTML = resources.map(createResourceCard).join('');
            lucide.createIcons();
        });
    </script>
</body>
</html>
